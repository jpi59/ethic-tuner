plugins { id 'com.android.application' }

import java.util.Properties

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file('keystore.properties')
if (signingPropertiesFile.isFile()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}
def signingKeys = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
def releaseSigningConfigured = signingKeys.every { signingProperties.getProperty(it)?.trim() }

android {
    namespace 'org.jpi59.ethictuner'
    compileSdk 36
    defaultConfig {
        applicationId 'org.jpi59.ethictuner'
        minSdk 24
        targetSdk 36
        versionCode 30
        versionName '1.0.29'
    }
    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile rootProject.file(signingProperties.getProperty('storeFile'))
                storePassword signingProperties.getProperty('storePassword')
                keyAlias signingProperties.getProperty('keyAlias')
                keyPassword signingProperties.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
    }
    dependenciesInfo { includeInApk = false; includeInBundle = false }
}

dependencies { testImplementation 'junit:junit:4.13.2' }
